---
- hosts: distribution_switches
  tasks:
    - name: "[VLAN10] Configure ACL permiting ZABBIX, DHCP, internet traffic on distribution switches"
      cisco.ios.ios_acls:
        config:
          - afi: "ipv4"
            acls:
              - name: "VLAN10-USER-POLICY"
                acl_type: "extended"
                aces:
                  - grant: "permit"
                    source:
                      address: "10.1.10.0"
                      wildcard_bits: "0.0.0.255"
                    destination:
                      host: "10.1.30.150"
                      port_protocol:
                        eq: "8080"
                  - grant: "deny"
                    source:
                      address: "10.1.10.0"
                      wildcard_bits: "0.0.0.255"
                    destination:
                      address: "10.1.99.0"
                      wildcard_bits: "0.0.0.255"
                  - grant: "deny"
                    source:
                      address: "10.1.10.0"
                      wildcard_bits: "0.0.0.255"
                    destination:
                      address: "10.1.30.0"
                      wildcard_bits: "0.0.0.255"
                  - grant: "deny"
                    source:
                      address: "10.1.10.0"
                      wildcard_bits: "0.0.0.255"
                    destination:
                      address: "10.1.20.0"
                      wildcard_bits: "0.0.0.255"
                  - grant: "permit"
                    source:
                      address: "10.1.10.0"
                      wildcard_bits: "0.0.0.255"
                    destination:
                      any: true
        state: merged

    - name: Assign VLAN10-USER-POLICY ACL to Vlan10 inbound on distribution switches
      cisco.ios.ios_acl_interfaces:
        config:
          - name: Vlan10
            access_group:
              - afi: ipv4
                acls:
                  - name: VLAN10-USER-POLICY
                    direction: in
        state: replaced

    - name: Save running to startup when changed
      cisco.ios.ios_config:
        save_when: modified 
