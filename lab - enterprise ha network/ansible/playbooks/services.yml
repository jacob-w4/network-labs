---
- hosts: cisco
  become: yes

  tasks:
    - name: Configure DNS on Cisco devices
      cisco.ios.ios_system:
        name_servers: "{{ dns_servers }}"

    - name: Configure Syslog on Cisco devices
      cisco.ios.ios_logging_global:
        config:
          hosts: 
            - host: "{{ syslog_server_ip }}"
          trap: "informational"
          source_interface: "{{ syslog_source_interface }}"
          userinfo: true

    - name: Configure NTP on Cisco devices
      cisco.ios.ios_ntp_global:
        config: 
          servers: "{{ ntp_servers }}"
          source: "{{ ntp_source_interface }}" 
          update_calendar: true

        